[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "models",
  "fastapi>=0.128.0",
  "uvicorn>=0.40.0",
  "sqlalchemy>=2.0.45",
  "psycopg2-binary>=2.9.10",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.1",
  "bcrypt>=5.0.0",
  "pwdlib[argon2]>=0.3.0",
  "python-multipart>=0.0.21",
]

[tool.uv.sources]
models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]