[project]
name = "frontend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "streamlit>=1.53.0",
  "models",
  "requests>=2.32.5",
  "pandas>=2.3.3",
  "pyvis>=0.3.2",
  "networkx>=3.6.1",
]

[tool.uv.sources]
models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]